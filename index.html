<!DOCTYPE html>
<html lang="pa">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sight Words</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


    <!-- =================================
         HEADER
    ================================== -->

    <header>

        <h1>Sight Words</h1>

        <p>
            Learn many sight words
        </p>

    </header>



    <!-- =================================
         MAIN
    ================================== -->

    <main>


        <!-- =================================
             CARD
        ================================== -->

        <div class="card-container">

            <div
                id="card"
                class="card"
            >
                <!-- Sight Word rendered here -->
            </div>

        </div>


        <!-- =================================
             FLAG ACTION BUTTON
        ================================== -->

        <div class="flag-container">
            <button id="flagBtn" class="flag-button">
                🚩 Flag for Review
            </button>
        </div>


        <!-- =================================
             CARD NUMBER
        ================================== -->

        <div
            id="cardNumber"
            class="card-number"
        >
            Card 1 of 86
        </div>



        <!-- =================================
             PROGRESS
        ================================== -->

        <div
            id="counter"
            class="counter"
        >
            0 Flagged • 86 Remaining
        </div>



        <!-- =================================
             PROGRESS BAR
        ================================== -->

        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>



        <!-- =================================
             CONTROLS
        ================================== -->

        <div class="controls">

            <button id="prevBtn">
                ← Previous
            </button>


            <button id="randomBtn">
                🎲 Random
            </button>


            <button id="shuffleBtn">
                🔀 Shuffle
            </button>


            <button id="reviewFlaggedBtn" class="mode-button">
                🚩 Review Flagged (0)
            </button>


            <button id="nextBtn">
                Next →
            </button>

        </div>



        <!-- =================================
             START OVER
        ================================== -->

        <button
            id="resetBtn"
            class="reset-button"
        >

            ↻ Start Over

        </button>


    </main>



    <!-- =================================
         FOOTER
    ================================== -->

    <footer>

        Sight Words Learning Game

    </footer>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="script.js"></script>


</body>

</html>
